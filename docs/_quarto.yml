project:
  type: website
  output-dir: _site

filters:
  - jeroenjanssens/term

extensions:
  term:
    shell: zsh
    init:
      - zsh-syntax-highlighting
      - "setopt INTERACTIVE_COMMENTS"
      # quarto-term starts sessions in $HOME; run next to the document instead.
      # Escape quotes and dollars, since metadata strings are parsed as markdown.
      - 'cd \"\$QUARTO_DOCUMENT_PATH\"'
    spacing: true
    timeout: 120
    # rush's code is part of the cache key, so that cells run again when it
    # changes. Paths are relative to each page; see reference/_metadata.yml
    # and formats/_metadata.yml for the pages in those directories.
    cache-depends:
      - ../R
      - ../exec
    style:
      html:
        colorscheme-light: solarized-dark
        colorscheme-dark: solarized-light

website:
  title: "rush"
  site-url: https://rush.jeroenjanssens.com
  repo-url: https://github.com/jeroenjanssens/rush
  repo-actions: [edit, issue]
  navbar:
    left:
      - text: "Get started"
        href: get-started.qmd
      - text: "Commands"
        menu:
          - text: "rush run"
            href: reference/run.qmd
          - text: "rush sql"
            href: reference/sql.qmd
          - text: "rush plot"
            href: reference/plot.qmd
          - text: "rush convert"
            href: reference/convert.qmd
      - text: "Formats"
        menu:
          - text: "Overview"
            href: formats.qmd
          - text: "---"
          - text: "Delimited (CSV/TSV)"
            href: formats/delimited.qmd
          - text: "Parquet"
            href: formats/parquet.qmd
          - text: "JSON / JSONL"
            href: formats/json.qmd
          - text: "Excel / ODS"
            href: formats/excel.qmd
          - text: "Arrow IPC"
            href: formats/arrow.qmd
          - text: "DuckDB / SQLite"
            href: formats/databases.qmd
          - text: "Statistical (SPSS, Stata, SAS)"
            href: formats/statistical.qmd
          - text: "Bioinformatics (FASTA/FASTQ)"
            href: formats/bioinformatics.qmd
          - text: "Structured (YAML, TOML, XML, RDS, FWF)"
            href: formats/structured.qmd
      - text: "Pipelines"
        href: pipelines.qmd
      - text: "Scripts"
        href: scripts.qmd
    right:
      - text: "Changelog"
        href: changelog.qmd
      - icon: github
        href: https://github.com/jeroenjanssens/rush

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
