name: Quarto website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: quarto-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
      PKG_CRAN_MIRROR: https://packagemanager.posit.co/cran/__linux__/noble/latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # zsh for the {term} sessions; libcurl headers because ir builds its
      # pak resolver from source
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh zsh-syntax-highlighting libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ir-build/target
          key: ${{ runner.os }}-cargo-ir-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cargo-ir-

      - name: Build and install ir from source
        run: |
          rm -rf /tmp/ir-build
          git clone --depth 1 https://github.com/r-lib/ir.git /tmp/ir-build
          cargo install --path /tmp/ir-build
        shell: bash

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache ir package library
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/ir
            ~/.local/share/ir
          key: ${{ runner.os }}-ir-pkgs-${{ hashFiles('docs/**/*.qmd') }}
          restore-keys: ${{ runner.os }}-ir-pkgs-

      # Install rush the way users do, so the docs run the checked-out code
      - name: Install rush
        run: |
          ir tool install --force --bin-dir "$HOME/.local/bin" local::.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Build website
        run: quarto render docs

      # Quarto doesn't fail when a {term} cell prints an R error, so check
      # the rendered pages (and the homepage recording) for them
      - name: Check rendered examples for R errors
        run: |
          if grep -rlE "Execution halted|there is no package called" docs/_site; then
            echo "::error::Rendered docs contain R errors (files listed above)"
            exit 1
          fi
        shell: bash

      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
