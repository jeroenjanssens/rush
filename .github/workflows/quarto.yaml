name: Quarto website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: quarto-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PKG_CRAN_MIRROR: https://packagemanager.posit.co/cran/__linux__/noble/latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::palmerpenguins
            any::tidyverse
            any::glue
            any::ggplot2
          needs: website

      - name: Install ir and set up rush
        run: |
          curl -fsSL https://github.com/r-lib/ir/releases/latest/download/ir-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local/bin
          chmod +x exec/rush.R
          sudo ln -sf $(pwd)/exec/rush.R /usr/local/bin/rush
        shell: bash

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build website
        run: quarto render docs

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs/_site
