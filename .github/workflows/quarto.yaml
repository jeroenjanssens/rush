name: Quarto website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: quarto-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
      PKG_CRAN_MIRROR: https://packagemanager.posit.co/cran/__linux__/noble/latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::pak
            any::renv
            any::secretbase
            any::palmerpenguins
            any::tidyverse
          needs: website

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ir-build/target
          key: ${{ runner.os }}-cargo-ir-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cargo-ir-

      - name: Build and install ir from source
        run: |
          rm -rf /tmp/ir-build
          git clone --depth 1 https://github.com/r-lib/ir.git /tmp/ir-build
          cargo install --path /tmp/ir-build
        shell: bash

      - name: Set up rush
        run: |
          chmod +x exec/rush.R
          sudo ln -sf $(pwd)/exec/rush.R /usr/local/bin/rush
        shell: bash

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build website
        run: quarto render docs

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs/_site
