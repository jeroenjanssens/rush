name: Test ir

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Pre-install ir tooling packages (binary)
        run: Rscript -e 'install.packages(c("pak", "renv", "secretbase"))'

      - name: Install ir
        run: |
          curl -fsSL https://raw.githubusercontent.com/r-lib/ir/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Test ir (no deps)
        run: ir run -e 'print(head(iris))'

      - name: Test ir (tidyverse)
        run: |
          cat > test.R << 'EOF'
          #!/usr/bin/env -S ir run
          #| packages:
          #|   - tidyverse
          library(tidyverse)
          iris |> as_tibble() |> filter(Sepal.Length > 7) |> select(Species, Sepal.Length) |> print()
          EOF
          chmod +x test.R
          ./test.R

      - name: Test ir (tidyverse reuse)
        run: |
          cat > test2.R << 'EOF'
          #!/usr/bin/env -S ir run
          #| packages:
          #|   - tidyverse
          library(tidyverse)
          iris |> as_tibble() |> group_by(Species) |> summarise(mean_sepal = mean(Sepal.Length)) |> print()
          EOF
          chmod +x test2.R
          ./test2.R

      - name: Test ir (duckdb)
        run: |
          cat > test3.R << 'EOF'
          #!/usr/bin/env -S ir run
          #| packages:
          #|   - duckdb
          #|   - DBI
          con <- DBI::dbConnect(duckdb::duckdb())
          DBI::dbWriteTable(con, "iris", iris)
          print(DBI::dbGetQuery(con, "SELECT Species, AVG(\"Sepal.Length\") as mean_sl FROM iris GROUP BY Species"))
          DBI::dbDisconnect(con, shutdown = TRUE)
          EOF
          chmod +x test3.R
          ./test3.R
